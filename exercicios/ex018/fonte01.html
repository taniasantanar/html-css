<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google Fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Playwrite+BR:wght@100..400&display=swap');
        body {
            font-family: 'Work Sans', Arial, Verdana, sans-serif;
            font-size: 16px;
            color: black;
        }
        h1 {
            font-family: 'Playwrite BR', sans-serif;
            font-size: 3em;
        }
        h2 {
            font-family: 'Playwrite BR', sans-serif;
            font-size: 2em;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Veritatis odit impedit, iste sed optio libero reprehenderit necessitatibus possimus eaque deleniti! Enim ad alias eius unde consequatur similique cumque officia quis.</p>
    <h2>Subtítulo</h2>
</body>
</html>
