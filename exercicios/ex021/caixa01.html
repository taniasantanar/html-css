<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 { /*Box-Level*/
            background-color: lightgray;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;

            /* Shorthand do border:
            border: 10px solid darkslategray;
            */

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            /* Shorthand do padding:
            padding: 10px 10px 10px 10px;
            E se os valores forem iguais:
            padding: 10px;
            E se forem 2 valores diferentes:
            padding: 10px 20px; Isso significa que o padding top e bottom são 10px e padding right e left são 20px.
            */

            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;

            /* Shorthand do margin:
            margin: 20px 20px 40px 20px;
            margin: 20px auto 40px auto; -> Calcula as margens da direita e esquerda automáticamente para que a caixa fique centralizada.
            */

            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;

            /* Shorthand do outline:
            outline: 5px dashed salmon;
            */
        }
        a { /*Inline-Level*/
            border-width: 10px;
            border-style: groove;
            border-color: red;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Caixa Box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona</p>
</body>
</html>
